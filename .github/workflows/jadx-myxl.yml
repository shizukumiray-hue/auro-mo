name: APK Decompilation with JADX

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK/XAPK URL (optional)'
        required: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl file
          
      - name: Get JADX
        run: |
          LATEST=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | grep tag_name | cut -d'"' -f4)
          wget -q "https://github.com/skylot/jadx/releases/download/${LATEST}/jadx-${LATEST#v}.zip"
          unzip jadx-*.zip
          chmod +x jadx/bin/*
          
      - name: Download APK (if URL provided)
        if: github.event.inputs.apk_url != ''
        run: |
          curl -L -s -o input.apk "${{ github.event.inputs.apk_url }}"
          
      - name: Extract if XAPK
        run: |
          if [ -f input.apk ] && file input.apk | grep -q "Zip"; then
            unzip -q input.apk -d extracted/
            # Find largest APK (usually main)
            find extracted/ -name "*.apk" -exec du -b {} + | sort -rn | head -1 | cut -f2- > main_apk.txt
          elif [ -f input.apk ]; then
            echo "input.apk" > main_apk.txt
          fi
          
      - name: Decompile with JADX
        env:
          JAVA_OPTS: "-Xmx4G -XX:+UseG1GC"
        run: |
          MAIN_APK=$(cat main_apk.txt 2>/dev/null || echo "")
          if [ -z "$MAIN_APK" ] || [ ! -f "$MAIN_APK" ]; then
            echo "No APK found. Please provide one via artifact or URL."
            exit 1
          fi
          
          jadx/bin/jadx \
            --threads-count 2 \
            --show-bad-code \
            --no-imports \
            --no-res \
            "$MAIN_APK" \
            -d output/
            
      - name: Archive results
        run: |
          zip -qr decompiled.zip output/
          ls -lh decompiled.zip
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-sources
          path: decompiled.zip
          
      - name: Cleanup
        if: always()
        run: rm -rf input.apk extracted/ jadx* *.zip output/
