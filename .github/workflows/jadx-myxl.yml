name: Decompile APK with JADX

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl file
          
      - name: Setup JADX (Fixed)
        run: |
          # Download latest JADX
          LATEST=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.tag_name')
          echo "Downloading JADX $LATEST"
          wget -q "https://github.com/skylot/jadx/releases/download/${LATEST}/jadx-${LATEST#v}.zip"
          
          # Extract and ensure consistent structure
          unzip -q jadx-*.zip
          
          # Create jadx directory if it doesn't exist
          if [ ! -d "jadx" ]; then
            mkdir -p jadx
            mv bin lib README.md LICENSE jadx/ 2>/dev/null || true
          fi
          
          # Make executable
          chmod +x jadx/bin/*
          
          # Verify
          ls -la jadx/
          jadx/bin/jadx --version
          
      - name: Download APK (contoh)
        run: |
          # Contoh download APK demo untuk testing
          wget -q -O sample.apk https://github.com/derikadi/echo/raw/master/apk/echo.apk
          
      - name: Decompile APK
        env:
          JAVA_OPTS: "-Xmx4G"
        run: |
          jadx/bin/jadx \
            --threads 2 \
            --no-res \
            sample.apk \
            -d decompiled-output
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-sources
          path: decompiled-output
